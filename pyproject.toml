[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hf-workspace"
version = "0.1.0"
description = "Personal Hugging Face integration workspace"
authors = [
    { name = "Febriyansyah" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "transformers>=4.40.0",
    "datasets>=2.19.0",
    "accelerate>=0.29.0",
    "peft>=0.13.0",
    "trl>=0.14.0",
    "bitsandbytes>=0.43.0",
    "tokenizers>=0.21.0",
    "safetensors>=0.44.0",
    "torch>=2.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
extend-select = ["E501"]
